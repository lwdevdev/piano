<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/normalize.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
    <title>Practice</title>
  </head>
  <body>
    <h1>Practice1</h1>
    <main>
      <div>
        <button id="btn--start">Start</button>
        <button id="btn--stop">Stop</button>

        <div id="notes">—</div>

        <label for="timer">Timer Speed (ms):</label>
        <input id="timer" step="500" min="0" max="10000" type="number" inputmode="numeric">
      </div>

      <div>
        <label for="selectedNotes">Notes</label>
        <select id="selectedNotes" name="selectedNotes" size="12" multiple>
          <option selected value="Ab">Ab</option>
          <option selected value="A">A</option>
          <option selected value="Bb">Bb</option>
          <option selected value="B">B</option>
          <option selected value="C">C</option>
          <option selected value="Db">Db</option>
          <option selected value="D">D</option>
          <option selected value="Eb">Eb</option>
          <option selected value="E">E</option>
          <option selected value="F">F</option>
          <option selected value="Gb">Gb</option>
          <option selected value="G">G</option>
        </select>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
